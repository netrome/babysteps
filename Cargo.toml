[workspace]
members = [
    "crates/event",
    "crates/server",
]

[workspace.dependencies]
array-bytes = "6.1.0"
ciborium = "0.2.1"
clap = { version = "4.4.5", features = ["derive"] }
hex-literal = "0.4.1"
k256 = { version = "0.13.1", features = ["schnorr"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
sled = "0.34.7"
time = { version = "0.3.28", features = ["serde", "serde-well-known"] }
tokio = { version = "1.32.0", features = ["full"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "fmt", "time"] }
warp = "0.3.5"
