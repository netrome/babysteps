[package]
name = "babysteps"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.75"
array-bytes = "6.1.0"
async-trait = "0.1.74"
ciborium = "0.2.1"
clap = { version = "4.4.5", features = ["derive", "env"] }
hex-literal = "0.4.1"
k256 = { version = "0.13.1", features = ["schnorr", "serde"] }
serde = { version = "1.0.188", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0"
sha2 = "0.10.8"
sled = "0.34.7"
sqlx = { version = "0.7", features = [ "runtime-tokio", "postgres", "macros", "time" ] }
time = { version = "0.3.28", features = ["serde", "serde-well-known"] }
tokio = { version = "1.32.0", features = ["full"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "fmt", "time"] }
warp = "0.3.5"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
