apiVersion: apps/v1
kind: Deployment
metadata:
  name: babysteps
  labels:
    app: babysteps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: babysteps
  template:
    metadata:
      labels:
        app: babysteps
    spec:
      containers:
      - name: babysteps
        image: netrome/babysteps:0.1.2
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: postgresql://user:password@postgres:5432/babysteps
        - name: RUST_LOG
          value: info
